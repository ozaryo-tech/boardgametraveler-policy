<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  body { width: 340px; margin: 0; padding: 14px; font: 13px/1.55 system-ui, "Yu Gothic UI", sans-serif; color: #222; }
  h1 { font-size: 15px; margin: 0 0 4px; }
  .site { color: #666; font-size: 12px; margin-bottom: 8px; min-height: 1.4em; }
  .mode { display: block; padding: 6px 8px; border: 1px solid #ccc; border-radius: 6px; margin: 5px 0; cursor: pointer; }
  .mode.off { opacity: .45; cursor: default; }
  .mode small { color: #666; display: block; margin-left: 20px; }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .row.wrap { flex-wrap: wrap; }
  input[type=range] { flex: 1; }
  input[type=number] { width: 56px; padding: 2px 4px; }
  button { padding: 8px; border: 0; border-radius: 6px; font-size: 14px; cursor: pointer; background: #1a5fb4; color: #fff; }
  button.full { width: 100%; margin-top: 10px; }
  button.stop { background: #c01c28; }
  button.sub { background: #eee; color: #222; font-size: 12px; padding: 5px 10px; border: 1px solid #ccc; }
  button:disabled { opacity: .5; cursor: default; }
  hr { border: 0; border-top: 1px solid #ddd; margin: 12px 0 8px; }
  #status { margin-top: 10px; padding: 8px; background: #f3f3f3; border-radius: 6px; min-height: 2.4em; white-space: pre-wrap; }
  #timer { font-variant-numeric: tabular-nums; font-weight: 700; color: #c01c28; }
  .note { color: #8f5d00; font-size: 12px; margin-top: 4px; }
</style>
</head>
<body>
  <h1>ページを取り込む</h1>
  <div class="site" id="site"></div>

  <label class="mode" id="mAuto"><input type="radio" name="mode" value="auto" checked> 抽出＋録画（自動スクロール）
    <small>文章・画像を抽出し、自動でスクロールしながら録画します。</small></label>
  <label class="mode" id="mManual"><input type="radio" name="mode" value="manual"> 抽出＋録画（手動）
    <small>自分でスクロールした様子を録画し、停止ボタンで終了します。</small></label>
  <label class="mode" id="mExtract"><input type="radio" name="mode" value="extract"> 抽出のみ
    <small>録画せず、文章と画像だけ保存します。</small></label>
  <div class="note" id="ytNote" hidden>YouTubeの動画ページは、概要欄・チャプター・字幕の取得のみ行います（録画はしません）。</div>

  <div class="row" id="speedRow">
    <span>スクロール速度</span>
    <input type="range" id="speed" min="40" max="400" step="10" value="120">
    <span><span id="speedVal">120</span>px/秒</span>
  </div>

  <div class="row wrap" id="multiRow">
    <label><input type="checkbox" id="multi"> 次のページも続けて取り込む</label>
    <span>最大 <input type="number" id="maxPages" min="1" max="50" value="10"> ページ</span>
  </div>
  <div class="note" id="multiNote" hidden>このサイトへのアクセス許可を求める画面が出たら、許可してください。</div>

  <button class="full" id="go">開始</button>
  <button class="full stop" id="stop" hidden>停止して保存</button>
  <div id="status"></div>
  <div class="row" id="timerRow" hidden>● <span id="timer">00:00</span><span id="progress"></span></div>

  <hr>
  <div class="row wrap">
    <button class="sub" id="pick">本文範囲を指定…</button>
    <button class="sub" id="resetSite" hidden>このサイトの指定を消す</button>
  </div>
  <div class="site" id="ovInfo"></div>
  <script src="popup.js"></script>
</body>
</html>
